<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MovieCode{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
<nav class="bg-gray-900 border-b border-gray-800">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/" class="text-xl font-bold text-indigo-400">MovieCode</a>
        <div class="flex items-center gap-4">
            {% if user %}
                <span class="text-sm text-gray-300">{{ user.full_name }}</span>
                {% if user.is_admin %}
                    <a href="/admin/" class="text-sm bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg">Админка</a>
                {% endif %}
                <a href="/auth/logout" class="text-sm text-red-400 hover:text-red-300">Выйти</a>
            {% else %}
                <a href="/auth/google" class="text-sm bg-white text-gray-900 px-3 py-1.5 rounded-lg font-medium">Войти через Google</a>
                <script async src="https://telegram.org/js/telegram-widget.js?22"
                    data-telegram-login="ВАШ_БОТ_БЕЗ_@"
                    data-size="medium"
                    data-radius="8"
                    data-auth-url="{{ request.base_url }}auth/telegram/callback"
                    data-request-access="write"></script>
            {% endif %}
        </div>
    </div>
</nav>

<main class="max-w-5xl mx-auto px-4 py-10">
    {% block content %}{% endblock %}
</main>
</body>
</html>
