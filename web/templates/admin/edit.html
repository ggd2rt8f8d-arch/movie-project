{% extends "base.html" %}
{% block title %}Редактировать — {{ movie.title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto slide-up">
    <div class="mb-8">
        <a href="/admin/" class="text-gray-400 hover:text-white transition-colors">
            <i class="fas fa-arrow-left mr-2"></i>
            Назад в админку
        </a>
        <h1 class="text-4xl font-extrabold gradient-text mt-4">Редактировать фильм</h1>
        <div class="flex items-center gap-2 mt-2">
            <span class="text-gray-400">Код:</span>
            <code class="bg-gray-800/50 px-3 py-1 rounded-lg text-sm font-mono">{{ movie.code }}</code>
        </div>
    </div>

    <form action="/admin/edit/{{ movie.code }}" method="post" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">
                    <i class="fas fa-heading mr-2"></i>Название
                </label>
                <input type="text" name="title" required value="{{ movie.title }}"
                       class="w-full bg-gray-900/50 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all input-focus">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">
                    <i class="fas fa-calendar-alt mr-2"></i>Год
                </label>
                <input type="number" name="year" required min="1900" max="2030" value="{{ movie.year }}"
                       class="w-full bg-gray-900/50 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all input-focus">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">
                <i class="fas fa-image mr-2"></i>Ссылка на постер
            </label>
            <input type="url" name="poster" required value="{{ movie.poster }}"
                   class="w-full bg-gray-900/50 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all input-focus">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">
                <i class="fas fa-align-left mr-2"></i>Описание
            </label>
            <textarea name="description" required rows="6"
                      class="w-full bg-gray-900/50 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all input-focus resize-y">{{ movie.description }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">
                <i class="fas fa-star mr-2"></i>Рейтинг IMDb
            </label>
            <input type="text" name="rating" required value="{{ movie.rating }}"
                   class="w-full bg-gray-900/50 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all input-focus">
        </div>

        <div class="flex flex-wrap gap-4 pt-4">
            <button type="submit" class="relative group">
                <div class="absolute inset-0 bg-indigo-500 rounded-xl blur opacity-50 group-hover:opacity-75 transition-opacity"></div>
                <div class="relative flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-600 px-8 py-3 rounded-xl font-semibold transition-all hover:scale-105">
                    <i class="fas fa-save"></i>
                    <span>Сохранить изменения</span>
                </div>
            </button>
            <a href="/movie/{{ movie.code }}" class="glass-effect px-8 py-3 rounded-xl hover:bg-white/10 transition-all">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
